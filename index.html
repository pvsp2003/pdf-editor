<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDF Editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<style>
  :root {
    --chrome: #f7f6f3;      /* toolbar + status bar */
    --desk: #dedbd5;        /* area behind the pages */
    --ink: #1c1b19;
    --muted: #75726b;
    --line: #d6d3cc;
    --line-strong: #bdb9b0;
    --hover: #ebe9e4;
    --pressed: #e2dfd9;
    --accent: #d4461b;      /* selection, guides, focus */
    --on-ink: #f7f6f3;
    --danger: #b42318;
    --page-shadow: 0 1px 2px rgba(28, 27, 25, .18), 0 4px 14px rgba(28, 27, 25, .10);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --chrome: #1f1e1c;
      --desk: #141312;
      --ink: #ecebe7;
      --muted: #9a978f;
      --line: #33312e;
      --line-strong: #4a4743;
      --hover: #2a2926;
      --pressed: #34322f;
      --accent: #f0703f;
      --on-ink: #1f1e1c;
      --danger: #f97066;
      --page-shadow: 0 1px 2px rgba(0, 0, 0, .5), 0 6px 20px rgba(0, 0, 0, .45);
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; display: flex; flex-direction: column; background: var(--desk); color: var(--ink);
    font: 13px/1.4 "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .mono { font-family: "IBM Plex Mono", ui-monospace, Consolas, monospace; }
  svg.i { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: none; }

  /* ---------- toolbar ---------- */
  header {
    flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 4px;
    min-height: 48px; padding: 6px 12px; background: var(--chrome); border-bottom: 1px solid var(--line);
  }
  header h1 { font-size: 13px; font-weight: 600; margin: 0 10px 0 2px; white-space: nowrap; letter-spacing: .01em; }
  .sep { width: 1px; align-self: stretch; margin: 4px 8px; background: var(--line); }
  .group { display: flex; align-items: center; gap: 2px; }

  button, .btn {
    font: inherit; font-weight: 500; height: 30px; padding: 0 10px; display: inline-flex; align-items: center; gap: 6px;
    white-space: nowrap; cursor: pointer; color: var(--ink); background: transparent;
    border: 1px solid transparent; border-radius: 5px;
  }
  button:hover:not(:disabled), .btn:hover { background: var(--hover); }
  button:active:not(:disabled), .btn:active { background: var(--pressed); }
  button:disabled { color: var(--muted); opacity: .5; cursor: default; }
  button:focus-visible, .btn:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  button.icon { width: 30px; padding: 0; justify-content: center; }
  #bold.on { background: var(--pressed); border-color: var(--line-strong); }
  #del:hover:not(:disabled) { color: var(--danger); }

  /* mode switch */
  .seg { display: flex; border: 1px solid var(--line-strong); border-radius: 6px; overflow: hidden; }
  .seg button { border-radius: 0; height: 28px; border: 0; }
  .seg button + button { border-left: 1px solid var(--line-strong); }
  .seg button.on, .seg button.on:hover { background: var(--ink); color: var(--on-ink); }

  /* style controls */
  .field { display: flex; align-items: center; gap: 6px; color: var(--muted); padding: 0 4px; }
  input[type=number] {
    width: 54px; height: 28px; padding: 0 4px 0 8px; font: 500 12px "IBM Plex Mono", ui-monospace, monospace;
    color: var(--ink); background: var(--desk); border: 1px solid var(--line-strong); border-radius: 5px;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) input[type=number] { background: var(--desk); } }
  input[type=color] {
    width: 30px; height: 30px; padding: 6px; cursor: pointer; background: transparent;
    border: 1px solid transparent; border-radius: 5px;
  }
  input[type=color]:hover:not(:disabled) { background: var(--hover); }
  input[type=color]::-webkit-color-swatch-wrapper { padding: 0; }
  input[type=color]::-webkit-color-swatch { border: 1px solid var(--line-strong); border-radius: 3px; }
  input[type=color]::-moz-color-swatch { border: 1px solid var(--line-strong); border-radius: 3px; }
  input:disabled { opacity: .45; cursor: default; }
  #fileInput { display: none; }

  .spacer { flex: 1; }
  button.primary { background: var(--ink); color: var(--on-ink); padding: 0 14px; }
  button.primary:hover:not(:disabled) { background: var(--ink); opacity: .88; }
  button.primary:disabled { background: var(--line-strong); color: var(--chrome); opacity: 1; }

  @media (max-width: 1640px) { .lbl { display: none; } .seg button { padding: 0 9px; } }
  @media (max-width: 600px) { .sep { display: none; } header h1 { display: none; } }

  /* ---------- workspace ---------- */
  main { flex: 1; overflow: auto; position: relative; }

  #drop {
    width: min(520px, calc(100% - 32px)); margin: 12vh auto 40px; padding: 40px 32px; text-align: center;
    background: var(--chrome); border: 1px dashed var(--line-strong); border-radius: 8px;
  }
  #drop.drag { border: 1px solid var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  #drop .sheet { width: 44px; height: 56px; margin: 0 auto 18px; color: var(--muted); }
  #drop h2 { font-size: 16px; font-weight: 600; margin: 0 0 6px; }
  #drop p { color: var(--muted); margin: 0 0 20px; }
  #drop .btn { background: var(--ink); color: var(--on-ink); padding: 0 14px; height: 32px; }
  #drop .btn:hover { opacity: .88; }
  #drop .fine { margin: 18px 0 0; font-size: 12px; }

  #pages { padding: 28px 16px 48px; display: flex; flex-direction: column; align-items: safe center; gap: 28px; }
  .page { position: relative; background: #fff; box-shadow: var(--page-shadow); }
  .page canvas { display: block; }
  .layer { position: absolute; inset: 0; }
  body.add .layer { cursor: crosshair; }

  /* ---------- status bar ---------- */
  footer {
    flex: none; display: flex; align-items: center; gap: 16px; height: 26px; padding: 0 12px;
    background: var(--chrome); border-top: 1px solid var(--line); color: var(--muted);
    font: 11px "IBM Plex Mono", ui-monospace, monospace; white-space: nowrap; overflow: hidden;
  }
  footer .status { overflow: hidden; text-overflow: ellipsis; }
  footer .hint { margin-left: auto; }
  footer .credit { flex: none; color: var(--ink); text-decoration: none; padding-left: 16px; border-left: 1px solid var(--line); }
  footer .credit:hover { text-decoration: underline; }
  @media (max-width: 600px) { footer .hint { display: none; } footer .credit { margin-left: auto; } }
  #drop .credit-line { margin-top: 8px; }
  #drop .credit-line a { color: var(--ink); }

  /* Text boxes sit over the rendered page. Untouched ones are invisible so the original shows through. */
  .box {
    position: absolute; white-space: pre; outline: none; color: transparent; background: transparent;
    cursor: text; padding: 0; margin: 0;
  }
  .box:hover { box-shadow: 0 0 0 1px rgba(212, 70, 27, .55); }
  .box:focus, .box.dirty { color: var(--c, #000); }
  .box:focus { background: #fff; box-shadow: 0 0 0 1.5px #d4461b; }
  .box.new:not(:focus) { background: transparent; }
  .box.new:empty::before { content: "Type here"; color: #a8a49c; }
  body.move .box { cursor: move; box-shadow: 0 0 0 1px rgba(212, 70, 27, .3); user-select: none; touch-action: none; }
  body.move .box:hover, body.move .box.sel { box-shadow: 0 0 0 1.5px #d4461b; }
  body.move .box.new { background: transparent; }
  /* Hides the original text once it has been edited or moved away */
  .cover { position: absolute; background: #fff; display: none; pointer-events: none; }
  .cover.on { display: block; }
  /* Edited text drawn in the PDF's own font; the editable box underneath goes transparent */
  .preview { position: absolute; white-space: pre; pointer-events: none; }
  .box.pv:not(:focus) { color: transparent; }
  .box:focus + .preview { visibility: hidden; }
  /* Alignment guides shown while dragging */
  .guide { position: absolute; display: none; pointer-events: none; background: #d4461b; z-index: 5; }
  .guide.v { top: 0; bottom: 0; width: 1px; }
  .guide.h { left: 0; right: 0; height: 1px; }

  #toast {
    position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%); z-index: 20;
    background: var(--ink); color: var(--on-ink); padding: 8px 14px; border-radius: 5px; font-size: 12px;
    opacity: 0; transition: opacity .15s; pointer-events: none; max-width: calc(100vw - 32px);
  }
  #toast.show { opacity: 1; }
  body.move.has-doc #toast, body.annotate.has-doc #toast { bottom: 92px; } /* clear of the bottom bars */

  /* ---------- zoom ---------- */
  .zoom { display: flex; border: 1px solid var(--line-strong); border-radius: 6px; overflow: hidden; margin-right: 6px; }
  .zoom button { height: 28px; border-radius: 0; border: 0; }
  #zoomLbl { min-width: 52px; justify-content: center; font-size: 12px; padding: 0 4px; }

  /* ---------- find & replace ---------- */
  #findbar {
    flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 6px 12px;
    background: var(--chrome); border-bottom: 1px solid var(--line);
  }
  #findbar[hidden] { display: none; }
  #findbar input[type=text] {
    width: 200px; height: 28px; padding: 0 8px; font: inherit; color: var(--ink);
    background: var(--desk); border: 1px solid var(--line-strong); border-radius: 5px;
  }
  #findbar .check { display: flex; align-items: center; gap: 5px; color: var(--muted); margin: 0 4px; }
  #findCount { color: var(--muted); font-size: 11px; margin-left: 4px; }
  .box.match { background: rgba(250, 204, 21, .35); }
  .box.match.cur { background: rgba(250, 204, 21, .6); box-shadow: 0 0 0 1.5px #d4461b; }

  /* ---------- page slots & page tools ---------- */
  .slot { display: flex; flex-direction: column; gap: 6px; }
  .slot[hidden] { display: none; }
  .phead { display: flex; align-items: center; justify-content: space-between; gap: 12px; height: 24px; }
  .pnum { font: 11px "IBM Plex Mono", ui-monospace, monospace; color: var(--muted); }
  .ptools { display: flex; gap: 2px; opacity: 0; transition: opacity .12s; }
  .slot:hover .ptools, .ptools:focus-within { opacity: 1; }
  @media (hover: none) { .ptools { opacity: 1; } }
  .ptools button { width: 26px; height: 24px; padding: 0; justify-content: center; }
  .ptools button[data-act=del]:hover:not(:disabled) { color: var(--danger); }
  .pframe { position: relative; }
  .slot.rotated .layer { pointer-events: none; }

  /* ---------- images, signatures, redactions ---------- */
  .shape { position: absolute; z-index: 3; cursor: move; touch-action: none; }
  .shape.image img { display: block; width: 100%; height: 100%; pointer-events: none; user-select: none; }
  .shape.redact { background: #000; }
  .shape.sel { outline: 1.5px solid #d4461b; outline-offset: 1px; }
  .shape .handle {
    display: none; position: absolute; right: -6px; bottom: -6px; width: 11px; height: 11px;
    background: #fff; border: 1.5px solid #d4461b; cursor: nwse-resize;
  }
  .shape.sel .handle { display: block; }
  body.redact .layer { cursor: crosshair; }

  /* ---------- arrange bar (Move mode) ---------- */
  #arrange {
    position: fixed; bottom: 38px; left: 50%; transform: translateX(-50%); z-index: 15; display: none;
    align-items: center; gap: 2px; padding: 4px; max-width: calc(100vw - 24px); overflow-x: auto;
    background: var(--chrome); border: 1px solid var(--line-strong); border-radius: 8px;
    box-shadow: 0 6px 20px rgba(28, 27, 25, .16);
  }
  body.move.has-doc #arrange { display: flex; }

  /* ---------- annotate bar & marks ---------- */
  #annot {
    position: fixed; bottom: 38px; left: 50%; transform: translateX(-50%); z-index: 15; display: none;
    align-items: center; gap: 2px; padding: 4px; max-width: calc(100vw - 24px); overflow-x: auto;
    background: var(--chrome); border: 1px solid var(--line-strong); border-radius: 8px;
    box-shadow: 0 6px 20px rgba(28, 27, 25, .16);
  }
  body.annotate.has-doc #annot { display: flex; }
  #annot .sep { margin: 4px 4px; }
  #annot [data-tool].on { background: var(--ink); color: var(--on-ink); }
  #mkWidth {
    height: 28px; padding: 0 6px; font: inherit; color: var(--ink); background: var(--desk);
    border: 1px solid var(--line-strong); border-radius: 5px;
  }
  body.annotate .layer, body.annotate .box { cursor: crosshair; }
  body.annotate .box { user-select: none; }
  .shape.mark svg { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
  .shape.hl { mix-blend-mode: multiply; }
  .shape.line { pointer-events: none; }
  .shape.line .hit { pointer-events: stroke; stroke: transparent; stroke-width: 14px; cursor: move; }
  .shape.line .handle { pointer-events: auto; cursor: crosshair; }
  .shape.line.sel { outline: none; }
  .shape.line.sel svg { filter: drop-shadow(0 0 1.5px #d4461b); }
  /* Marks stay out of the way while editing text; select them in Annotate or Move mode */
  body:not(.annotate):not(.move) .shape.mark,
  body:not(.annotate):not(.move) .shape.mark .hit,
  body:not(.annotate):not(.move) .shape.mark .handle { pointer-events: none; }
  #arrange .sep { margin: 4px 4px; }
  #arCount { font-size: 11px; color: var(--muted); padding: 0 8px; white-space: nowrap; }

  /* ---------- signature dialog ---------- */
  dialog#sigDlg {
    width: min(640px, calc(100vw - 24px)); padding: 0; color: var(--ink); background: var(--chrome);
    border: 1px solid var(--line-strong); border-radius: 8px; box-shadow: 0 20px 60px rgba(0, 0, 0, .3);
  }
  dialog#sigDlg::backdrop { background: rgba(20, 19, 18, .45); }
  .dlg-head { padding: 12px 16px; font-weight: 600; border-bottom: 1px solid var(--line); }
  #sigPad {
    display: block; width: calc(100% - 32px); margin: 16px; aspect-ratio: 3 / 1; height: auto;
    background: #fff; border: 1px dashed var(--line-strong); border-radius: 5px; cursor: crosshair; touch-action: none;
  }
  .dlg-row { display: flex; align-items: center; gap: 6px; padding: 0 16px 14px; }
  .pen { width: 30px; padding: 0; justify-content: center; }
  .pen span { width: 14px; height: 14px; border-radius: 50%; }
  .pen.on { border-color: var(--line-strong); background: var(--pressed); }
</style>
</head>
<body>
<header>
  <h1>PDF Editor</h1>
  <label class="btn" for="fileInput" title="Open a PDF">
    <svg class="i" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span class="lbl">Open</span>
  </label>
  <input type="file" id="fileInput" accept="application/pdf">

  <div class="sep"></div>
  <div class="group">
    <button id="undo" class="icon" disabled title="Undo (Ctrl+Z)"><svg class="i" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
    <button id="redo" class="icon" disabled title="Redo (Ctrl+Y)"><svg class="i" viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg></button>
  </div>

  <div class="sep"></div>
  <div class="seg" role="group" aria-label="Mode">
    <button id="modeEdit" class="on" title="Click existing text to change it">Edit</button>
    <button id="modeAdd" title="Click anywhere on a page to add new text">Add text</button>
    <button id="modeMove" title="Drag text to move it; Shift+click or double-click to select several">Move</button>
    <button id="modeAnnotate" title="Highlight, underline, strike through, draw boxes, lines, arrows, ticks and crosses">Annotate</button>
    <button id="modeRedact" title="Drag over anything to black it out">Redact</button>
  </div>

  <div class="sep"></div>
  <div class="group">
    <label class="field" for="size">Size <input type="number" id="size" min="4" max="200" step="0.5" value="12" disabled></label>
    <button id="bold" class="icon" disabled title="Bold"><svg class="i" viewBox="0 0 24 24" style="stroke-width:2.4"><path d="M7 5h6a3.5 3.5 0 0 1 0 7H7z"/><path d="M7 12h7a3.5 3.5 0 0 1 0 7H7z"/></svg></button>
    <input type="color" id="color" value="#000000" disabled title="Text colour">
  </div>

  <div class="sep"></div>
  <div class="group">
    <button id="dup" disabled title="Copy the selected text or image with the same style (Ctrl+D)"><svg class="i" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="1.5"/><path d="M16 8V5.5A1.5 1.5 0 0 0 14.5 4h-9A1.5 1.5 0 0 0 4 5.5v9A1.5 1.5 0 0 0 5.5 16H8"/></svg><span class="lbl">Duplicate</span></button>
    <button id="del" disabled title="Remove the selection (Delete)"><svg class="i" viewBox="0 0 24 24"><path d="M4 7h16"/><path d="M10 11v6M14 11v6"/><path d="M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12"/><path d="M9 7V4h6v3"/></svg><span class="lbl">Delete</span></button>
  </div>

  <div class="sep"></div>
  <div class="group">
    <label class="btn" for="imgInput" title="Insert an image (PNG, JPG…)"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"/></svg><span class="lbl">Image</span></label>
    <input type="file" id="imgInput" accept="image/*" hidden>
    <button id="sigBtn" title="Draw a signature and place it"><svg class="i" viewBox="0 0 24 24"><path d="M3 16c2.5-.5 3.5-6 5.5-6s1 5 3 5 2.5-3 3.5-3 1.5 2.5 3 2.5"/><path d="M3 20h18"/></svg><span class="lbl">Signature</span></button>
    <button id="findBtn" title="Find &amp; replace (Ctrl+F)"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><span class="lbl">Find</span></button>
  </div>

  <div class="spacer"></div>
  <div class="zoom" role="group" aria-label="Zoom">
    <button id="zoomOut" class="icon" title="Zoom out (Ctrl −)"><svg class="i" viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
    <button id="zoomLbl" class="mono" title="Reset to 100% (Ctrl 0)">100%</button>
    <button id="zoomIn" class="icon" title="Zoom in (Ctrl +)"><svg class="i" viewBox="0 0 24 24"><path d="M5 12h14M12 5v14"/></svg></button>
  </div>
  <button id="download" class="primary" disabled title="Save the edited PDF">Download PDF</button>
</header>

<div id="findbar" hidden>
  <input type="text" id="findQ" placeholder="Find" spellcheck="false" autocomplete="off">
  <input type="text" id="findR" placeholder="Replace with" spellcheck="false" autocomplete="off">
  <label class="check"><input type="checkbox" id="findCase"> Match case</label>
  <button id="findPrev" class="icon" title="Previous (Shift+Enter)"><svg class="i" viewBox="0 0 24 24"><path d="m6 15 6-6 6 6"/></svg></button>
  <button id="findNext" class="icon" title="Next (Enter)"><svg class="i" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></button>
  <span id="findCount" class="mono"></span>
  <div class="spacer"></div>
  <button id="findOne">Replace</button>
  <button id="findAll">Replace all</button>
  <button id="findClose" class="icon" title="Close (Esc)"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
</div>

<main>
  <div id="drop">
    <svg class="sheet" viewBox="0 0 44 56" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 2h28l12 12v40H2z"/><path d="M30 2v12h12"/><path d="M10 26h24M10 33h24M10 40h16"/></svg>
    <h2>Open a PDF</h2>
    <p>Drag a file onto this window, or choose one.</p>
    <label class="btn" for="fileInput">Choose file…</label>
    <p class="fine">The file stays on your computer. Nothing is uploaded.</p>
    <p class="fine credit-line">Made by <a href="https://github.com/pvsp2003" target="_blank" rel="noopener">PVS Prasanth</a> · <a href="https://github.com/pvsp2003/pdf-editor" target="_blank" rel="noopener">Source on GitHub</a></p>
  </div>
  <div id="pages"></div>
</main>

<div id="arrange">
  <span id="arCount" class="mono">Nothing selected</span>
  <button id="arLine" disabled title="Select every piece on the same line">Select line</button>
  <div class="sep"></div>
  <button id="arLeft" disabled title="Line up left edges">Align left</button>
  <button id="arRight" disabled title="Line up right edges">Align right</button>
  <button id="arBase" disabled title="Put them on the same baseline">Same line</button>
  <button id="arJoin" disabled title="Merge into one piece of text">Join</button>
</div>

<div id="annot">
  <div class="group" role="group" aria-label="Annotation tool">
    <button data-tool="hl" class="icon on" title="Highlight — click text or drag across it"><svg class="i" viewBox="0 0 24 24"><path d="m9 11-6 6v3h9l3-3"/><path d="m22 12-4.6 4.6a2 2 0 0 1-2.8 0l-5.2-5.2a2 2 0 0 1 0-2.8L14 4"/></svg></button>
    <button data-tool="ul" class="icon" title="Underline — click text or drag under it"><svg class="i" viewBox="0 0 24 24"><path d="M6 4v6a6 6 0 0 0 12 0V4"/><path d="M4 20h16"/></svg></button>
    <button data-tool="st" class="icon" title="Strike through — click text or drag across it"><svg class="i" viewBox="0 0 24 24"><path d="M16 4H9a3 3 0 0 0-2.83 4"/><path d="M14 12a4 4 0 0 1 0 8H6"/><path d="M4 12h16"/></svg></button>
    <button data-tool="rect" class="icon" title="Box — drag to draw"><svg class="i" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="1"/></svg></button>
    <button data-tool="line" class="icon" title="Line — drag to draw (Shift keeps it straight)"><svg class="i" viewBox="0 0 24 24"><path d="M5 19 19 5"/></svg></button>
    <button data-tool="arrow" class="icon" title="Arrow — drag to draw (Shift keeps it straight)"><svg class="i" viewBox="0 0 24 24"><path d="M5 19 19 5"/><path d="M10 5h9v9"/></svg></button>
    <button data-tool="tick" class="icon" title="Tick — click to place, or drag to size"><svg class="i" viewBox="0 0 24 24"><path d="M4 12.5 9.5 18 20 6"/></svg></button>
    <button data-tool="cross" class="icon" title="Cross — click to place, or drag to size"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>

  <div class="sep"></div>
  <input type="color" id="mkColor" value="#ffd43b" title="Colour">
  <select id="mkWidth" title="Line thickness">

</div>

<footer>
  <span class="status" id="status">No document</span>
  <span class="hint" id="hint">Click text to edit it · Ctrl+F find &amp; replace</span>
  <a class="credit" href="https://github.com/pvsp2003" target="_blank" rel="noopener">Made by PVS Prasanth</a>
</footer>
<div id="toast"></div>

<dialog id="sigDlg">
  <form method="dialog">
    <div class="dlg-head">Draw your signature</div>
    <canvas id="sigPad" width="1200" height="400"></canvas>
    <div class="dlg-row">
      <button type="button" class="pen on" data-c="#111111" title="Black"><span style="background:#111111"></span></button>
      <button type="button" class="pen" data-c="#1d3fbb" title="Blue"><span style="background:#1d3fbb"></span></button>
      <button type="button" id="sigClear">Clear</button>
      <div class="spacer"></div>
      <button value="cancel">Cancel</button>
      <button value="ok" id="sigOk" class="primary" disabled>Insert</button>
    </div>
  </form>
</dialog>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const { PDFDocument, StandardFonts, rgb } = PDFLib;

const $ = id => document.getElementById(id);
const pagesEl = $('pages'), dropEl = $('drop'), mainEl = document.querySelector('main');
const state = {
  bytes: null, name: 'document.pdf', pages: [], order: [], boxes: [], shapes: [], fonts: {},
  mode: 'edit', selected: null, sel: new Set(), shape: null,
  undo: [], redo: [], batch: null, noMerge: false, zoom: 1,
};

// ---------- loading ----------
$('fileInput').addEventListener('change', e => { if (e.target.files[0]) loadPdf(e.target.files[0]); e.target.value = ''; });
['dragover', 'dragenter'].forEach(t => document.addEventListener(t, e => { e.preventDefault(); dropEl.classList.add('drag'); }));
['dragleave', 'drop'].forEach(t => document.addEventListener(t, e => { e.preventDefault(); dropEl.classList.remove('drag'); }));
document.addEventListener('drop', e => {
  const files = [...e.dataTransfer.files];
  const pdf = files.find(f => f.type === 'application/pdf' || f.name.toLowerCase().endsWith('.pdf'));
  const img = files.find(f => f.type.startsWith('image/'));
  if (pdf) loadPdf(pdf);
  else if (img && state.pages.length) insertImageFile(img);
  else toast('Please drop a PDF file');
});

// Canvas pixels per layout pixel: sharp at the current zoom, capped at ~16 megapixels per page
const renderRatio = vp => Math.min((window.devicePixelRatio || 1) * state.zoom, Math.sqrt(16e6 / (vp.width * vp.height)));

// (Re)draw a page into a fresh canvas and swap it in, so zooming never flashes a blank page
async function renderPage(p) {
  const k = renderRatio(p.vp);
  if (p.k === k && p.canvas) return p.canvas;
  p.task?.cancel();
  const canvas = document.createElement('canvas');
  canvas.width = Math.floor(p.vp.width * k);
  canvas.height = Math.floor(p.vp.height * k);
  canvas.style.width = p.vp.width + 'px';
  canvas.style.height = p.vp.height + 'px';
  const task = p.task = p.pdfPage.render({ canvasContext: canvas.getContext('2d'), viewport: p.vp, transform: [k, 0, 0, k, 0, 0] });
  try { await task.promise; } catch (err) { if (err?.name === 'RenderingCancelledException') return null; throw err; }
  if (p.task === task) p.task = null;
  if (p.canvas) p.canvas.replaceWith(canvas); else p.wrap.prepend(canvas);
  p.canvas = canvas; p.k = k;
  return canvas;
}

const PAGE_ICONS = {
  up: '<svg class="i" viewBox="0 0 24 24"><path d="m6 15 6-6 6 6"/></svg>',
  down: '<svg class="i" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>',
  rot: '<svg class="i" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v5h-5"/></svg>',
  del: '<svg class="i" viewBox="0 0 24 24"><path d="M4 7h16"/><path d="M10 11v6M14 11v6"/><path d="M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12"/><path d="M9 7V4h6v3"/></svg>',
};

// Each page lives in a slot: a header (page number + page tools) above a frame that holds the page
function buildSlot(idx, vp) {
  const slot = document.createElement('div');
  slot.className = 'slot';
  slot.dataset.page = idx;
  slot.innerHTML = `<div class="phead"><span class="pnum"></span><div class="ptools">
      <button data-act="up" title="Move page up">${PAGE_ICONS.up}</button>
      <button data-act="down" title="Move page down">${PAGE_ICONS.down}</button>
      <button data-act="rot" title="Rotate page 90°">${PAGE_ICONS.rot}</button>
      <button data-act="del" title="Delete page">${PAGE_ICONS.del}</button>
    </div></div><div class="pframe"><div class="page"><div class="layer"></div></div></div>`;
  const wrap = slot.querySelector('.page'), layer = slot.querySelector('.layer');
  wrap.style.width = vp.width + 'px';
  wrap.style.height = vp.height + 'px';
  layer.dataset.page = idx;
  return { slot, wrap, layer, frame: slot.querySelector('.pframe'), num: slot.querySelector('.pnum') };
}

async function loadPdf(file) {
  status('Loading…');
  try {
    const bytes = new Uint8Array(await file.arrayBuffer());
    // fontExtraProperties keeps each font's character map so edits can reuse the PDF's own fonts
    const doc = await pdfjsLib.getDocument({ data: bytes.slice(), fontExtraProperties: true }).promise;
    for (const p of state.pages) p.task?.cancel();
    closeFind();
    clearSel();
    Object.assign(state, { bytes, name: file.name, pages: [], order: [], boxes: [], shapes: [], fonts: {}, undo: [], redo: [], batch: null });
    updateToolbar(); updateUndoButtons();
    pagesEl.innerHTML = '';
    dropEl.style.display = 'none';
    document.body.classList.add('has-doc');

    const avail = Math.min(mainEl.clientWidth - 32, 1000);
    let textCount = 0;

    for (let i = 1; i <= doc.numPages; i++) {
      status(`Rendering page ${i} of ${doc.numPages}…`);
      const page = await doc.getPage(i);
      const scale = avail / page.getViewport({ scale: 1 }).width;
      const vp = page.getViewport({ scale });
      const p = { vp, scale, pdfPage: page, rot: 0, deleted: false, ...buildSlot(i - 1, vp) };
      state.pages.push(p);
      state.order.push(i - 1);
      pagesEl.append(p.slot);
      layoutPages();

      const canvas = await renderPage(p), k = p.k;
      const pixels = canvas.getContext('2d').getImageData(0, 0, canvas.width, canvas.height);

      const tc = await page.getTextContent();
      for (const item of tc.items) {
        if (!item.str || !item.str.trim()) continue;
        const tx = pdfjsLib.Util.transform(vp.transform, item.transform);
        if (Math.abs(tx[1]) > 0.01 || Math.abs(tx[2]) > 0.01) continue; // skip rotated text
        const fontPx = Math.hypot(tx[2], tx[3]);
        if (fontPx < 1) continue;
        const info = fontInfo(page, item.fontName, tc.styles[item.fontName]);
        if (!(item.fontName in state.fonts)) {
          let fo = null;
          try { fo = page.commonObjs.get(item.fontName); } catch (_) {}
          state.fonts[item.fontName] = prepFont(fo);
        }
        const width = item.width * scale;
        const { ink: color, bg } = inkColor(pixels, tx[4] * k, (tx[5] - fontPx * 0.8) * k, (tx[4] + width) * k, (tx[5] + fontPx * 0.1) * k);
        addBox({
          page: i - 1, left: tx[4], baseline: tx[5], fontPx, text: item.str, font: item.fontName,
          family: info.family, bold: info.bold, italic: info.italic, color,
          orig: { left: tx[4], top: tx[5] - fontPx, width, height: fontPx * 1.25, bg },
        });
        textCount++;
      }
    }
    // Strip encryption up front so the exported file opens everywhere
    state.saveError = null;
    try {
      const raw = await PDFDocument.load(state.bytes, { ignoreEncryption: true });
      if (await removeEncryption(raw, PDFLib)) state.bytes = await raw.save();
    } catch (err) {
      state.saveError = err.message;
      toast(err.message + " You can view it, but downloading edits won't work.", 6000);
    }
    $('download').disabled = false;
    status(`${doc.numPages} page${doc.numPages > 1 ? 's' : ''} · ${file.name}`);
    if (!textCount) toast('No editable text found (this may be a scanned PDF). You can still add text, images and redactions.', 5000);
  } catch (err) {
    console.error(err);
    if (!state.pages.length) {
      status('No document');
      dropEl.style.display = '';
      document.body.classList.remove('has-doc');
    }
    toast('Could not open this PDF: ' + err.message, 5000);
  }
}

// Text colour isn't in pdf.js's text content, so read it off the rendered page: within the text's
// rectangle, the pixels furthest from the background colour (taken from a ring just outside it) are the ink.
function inkColor(img, x0, y0, x1, y1) {
  const W = img.width, H = img.height, d = img.data;
  x0 = Math.max(0, Math.floor(x0)); y0 = Math.max(0, Math.floor(y0));
  x1 = Math.min(W, Math.ceil(x1)); y1 = Math.min(H, Math.ceil(y1));
  if (x1 - x0 < 1 || y1 - y0 < 1) return { ink: '#000000', bg: '#ffffff' };
  const step = Math.max(1, Math.floor(Math.sqrt((x1 - x0) * (y1 - y0) / 40000)));
  const quant = i => (d[i] >> 4) << 8 | (d[i + 1] >> 4) << 4 | (d[i + 2] >> 4);
  const counts = new Map(), px = [];
  const count = (x, y) => {
    if (x < 0 || y < 0 || x >= W || y >= H) return;
    const i = (y * W + x) * 4, q = quant(i);
    const c = counts.get(q) || counts.set(q, [0, 0, 0, 0]).get(q);
    c[0]++; c[1] += d[i]; c[2] += d[i + 1]; c[3] += d[i + 2];
  };
  const pad = 3;
  for (let x = x0 - pad; x < x1 + pad; x++) { count(x, y0 - pad); count(x, y1 + pad); }
  for (let y = y0 - pad; y < y1 + pad; y++) { count(x0 - pad, y); count(x1 + pad, y); }
  const ring = counts.size;
  for (let y = y0; y < y1; y += step) for (let x = x0; x < x1; x += step) {
    const i = (y * W + x) * 4;
    px.push(d[i], d[i + 1], d[i + 2]);
    if (!ring) count(x, y); // rect touches every page edge: fall back to the inside
  }
  let top = null; // most common colour bucket, averaged
  for (const c of counts.values()) if (!top || c[0] > top[0]) top = c;
  const [n0, sr, sg, sb] = top || [1, 255, 255, 255];
  const br = sr / n0, bgG = sg / n0, bb = sb / n0;
  const dist = new Float32Array(px.length / 3);
  let max = 0;
  for (let k = 0; k < dist.length; k++) {
    dist[k] = Math.hypot(px[3 * k] - br, px[3 * k + 1] - bgG, px[3 * k + 2] - bb);
    if (dist[k] > max) max = dist[k];
  }
  const hex = v => Math.round(Math.min(255, Math.max(0, v))).toString(16).padStart(2, '0');
  const bg = '#' + hex(br) + hex(bgG) + hex(bb);
  if (max < 40) return { ink: '#000000', bg };
  let r = 0, g = 0, b = 0, n = 0;
  for (let k = 0; k < dist.length; k++) if (dist[k] >= max * 0.85) { r += px[3 * k]; g += px[3 * k + 1]; b += px[3 * k + 2]; n++; }
  r /= n; g /= n; b /= n;
  if (Math.max(r, g, b) < 25 && Math.max(r, g, b) - Math.min(r, g, b) < 12) r = g = b = 0; // anti-aliased black
  return { ink: '#' + hex(r) + hex(g) + hex(b), bg };
}

// The PDF's embedded fonts are usually subsets, and pdf.js re-maps their glyphs to private-use
// code points. Build char -> glyph-code lookups so edited text can be drawn in the original font
// (on screen and in the export); characters missing from the subset fall back to a standard font.
function prepFont(fo) {
  if (!fo || fo.missingFile || fo.isType3Font || !fo.toUnicode) return null;
  const tu = fo.toUnicode, toFC = fo.toFontChar || [], rev = new Map();
  const add = (code, u) => {
    if (typeof u !== 'string' || [...u].length !== 1) return;
    if (toFC[code] === undefined && u !== ' ') return; // no glyph for it in the subset
    if (!rev.has(u)) rev.set(u, +code);
  };
  if (tu.firstChar !== undefined && !tu._map) for (let c = tu.firstChar; c <= tu.lastChar; c++) add(c, String.fromCharCode(c));
  else for (const [code, u] of Object.entries(tu._map || tu)) add(code, u);
  if (!rev.size) return null;
  return { name: fo.name, loadedName: fo.loadedName, composite: !!fo.composite, rev, toFC, widths: fo.widths || {}, dw: fo.defaultWidth || 0 };
}

// Original font is kept unless the user changed the weight
const origFont = box => box.font && state.fonts[box.font] && box.bold === box.origBold ? state.fonts[box.font] : null;

function fontInfo(page, fontName, style) {
  let name = '';
  try { name = page.commonObjs.get(fontName)?.name || ''; } catch (_) {}
  const fam = (style && style.fontFamily) || '';
  const all = (name + ' ' + fam).toLowerCase();
  let family = 'sans';
  if (/mono|courier|consol/.test(all)) family = 'mono';
  else if (/serif/.test(fam) && !/sans/.test(fam) || /times|georgia|garamond|cambria|book/.test(all)) family = 'serif';
  return { family, bold: /bold|black|heavy|semibold/.test(all), italic: /italic|oblique/.test(all) };
}

// ---------- text boxes ----------
const CSS_FAMILY = { sans: 'Helvetica, Arial, sans-serif', serif: '"Times New Roman", Times, serif', mono: '"Courier New", Courier, monospace' };

function addBox(b) {
  const box = { ...b, origText: b.text, origBold: b.origBold ?? b.bold, dirty: false, deleted: false };
  const el = document.createElement('div');
  el.className = 'box' + (b.orig ? '' : ' new');
  el.spellcheck = false;
  el.contentEditable = 'plaintext-only';
  if (el.contentEditable !== 'plaintext-only') el.contentEditable = 'true';
  el.textContent = b.text;
  box.el = el;
  el._box = box;
  if (b.orig) {
    const o = b.orig, cover = document.createElement('div');
    cover.className = 'cover';
    Object.assign(cover.style, { background: o.bg || '#fff', left: o.left - 1 + 'px', top: o.top - 1 + 'px', width: o.width + 2 + 'px', height: o.height + 2 + 'px' });
    state.pages[b.page].layer.append(cover);
    box.cover = cover;
  }
  styleBox(box);
  box.last = b.orig ? snap(box) : null; // new boxes enter the history on their first edit

  el.addEventListener('focus', () => select(box));
  el.addEventListener('input', () => { box.text = readText(el); markDirty(box); renderPreview(box); commit(box, 'text'); });
  el.addEventListener('beforeinput', e => {
    if (e.inputType === 'historyUndo') { e.preventDefault(); undo(); }
    if (e.inputType === 'historyRedo') { e.preventDefault(); redo(); }
  });
  el.addEventListener('paste', e => {
    e.preventDefault();
    document.execCommand('insertText', false, e.clipboardData.getData('text/plain'));
  });
  el.addEventListener('blur', () => {
    if (!box.orig && !box.deleted && !readText(el).trim()) removeBox(box); // drop empty new boxes
  });
  el.addEventListener('keydown', e => { if (e.key === 'Escape') el.blur(); });

  state.pages[b.page].layer.append(el);
  state.boxes.push(box);
  return box;
}

function styleBox(box) {
  const s = box.el.style;
  s.left = box.left + 'px';
  s.top = (box.baseline - box.fontPx) + 'px';
  s.fontSize = box.fontPx + 'px';
  s.lineHeight = (box.fontPx * 1.25) + 'px';
  s.fontFamily = CSS_FAMILY[box.family];
  s.fontWeight = box.bold ? '700' : '400';
  s.fontStyle = box.italic ? 'italic' : 'normal';
  s.minWidth = (box.orig ? box.orig.width : 8) + 'px';
  s.minHeight = (box.fontPx * 1.25) + 'px';
  s.setProperty('--c', box.color);
  renderPreview(box);
}

// When not being typed in, edited text is shown in the PDF's own font (as it will be exported)
function renderPreview(box) {
  const f = origFont(box), show = !!(f && box.dirty && box.text && box.el.isConnected);
  box.el.classList.toggle('pv', show);
  if (!show) { if (box.preview) box.preview.style.display = 'none'; return; }
  if (!box.preview) {
    box.preview = document.createElement('div');
    box.preview.className = 'preview';
    box.el.after(box.preview);
  }
  const p = box.preview, s = box.el.style;
  Object.assign(p.style, {
    display: '', left: s.left, top: s.top, fontSize: s.fontSize, lineHeight: s.lineHeight, color: box.color,
  });
  p.textContent = '';
  let run = null;
  for (const ch of box.text) {
    const code = f.rev.get(ch), has = code !== undefined && (ch === ' ' || f.toFC[code] !== undefined);
    if (!run || run.has !== has) {
      run = { has, el: document.createElement('span') };
      run.el.style.fontFamily = has ? `"${f.loadedName}", ${s.fontFamily}` : s.fontFamily;
      if (!has) { run.el.style.fontWeight = s.fontWeight; run.el.style.fontStyle = s.fontStyle; }
      p.append(run.el);
    }
    run.el.textContent += has && ch !== ' ' ? String.fromCodePoint(f.toFC[code]) : ch;
  }
}

const readText = el => el.innerText.replace(/\n+$/, '');

function markDirty(box) {
  box.dirty = true;
  box.el.classList.add('dirty');
  if (box.cover) box.cover.classList.add('on');
  updateStatusCount();
}

function removeBox(box) {
  if (box.orig) { // original text: blank it out (the export will white it out)
    box.text = ''; box.el.textContent = ''; markDirty(box);
  } else {
    box.deleted = true; box.el.remove(); box.preview?.remove(); box.preview = null;
    state.boxes = state.boxes.filter(b => b !== box);
  }
  deselect(box);
  commit(box, null);
}

// ---------- undo / redo ----------
// History entries: a text change { box, before, after }, a custom step { undo(), redo() },
// or a { group } of entries that undo together.
const snap = box => box.deleted ? null
  : { left: box.left, baseline: box.baseline, fontPx: box.fontPx, text: box.text, bold: box.bold, color: box.color, dirty: box.dirty };

function pushEntry(entry) {
  if (state.batch) { state.batch.push(entry); return; }
  state.undo.push(entry);
  state.noMerge = false;
  state.redo.length = 0;
  updateUndoButtons();
}

// Rapid changes of the same kind to the same box (typing, size spinner) merge into one step.
function commit(box, key) {
  const before = box.last, after = snap(box);
  if (JSON.stringify(before) === JSON.stringify(after)) return;
  box.last = after;
  const last = state.undo[state.undo.length - 1], now = Date.now();
  if (!state.batch && key && !state.noMerge && last && last.box === box && last.key === key && now - last.t < 1000) {
    last.after = after; last.t = now;
    return;
  }
  pushEntry({ box, before, after, key, t: now });
}

// Changes made between beginBatch() and endBatch() undo as one step. Repeats with the same key
// on the same boxes (nudging, the size spinner) merge into that step.
function beginBatch() { state.batch = []; }
function endBatch(key) {
  const g = state.batch;
  state.batch = null;
  if (!g || !g.length) return;
  const last = state.undo[state.undo.length - 1], now = Date.now();
  if (key && !state.noMerge && last?.group && last.key === key && now - last.t < 1000
      && last.group.length === g.length && last.group.every((e, i) => e.box && e.box === g[i].box)) {
    last.group.forEach((e, i) => { e.after = g[i].after; });
    last.t = now;
    return;
  }
  pushEntry({ group: g, key, t: now });
}

function pushOp(undoFn, redoFn) {
  pushEntry({ undo: undoFn, redo: redoFn, t: Date.now() });
  updateStatusCount();
}

function restore(box, s) {
  if (!s) {
    box.deleted = true; box.el.remove(); box.preview?.remove(); box.preview = null;
    state.boxes = state.boxes.filter(b => b !== box);
    deselect(box);
  } else {
    if (box.deleted) { box.deleted = false; state.pages[box.page].layer.append(box.el); state.boxes.push(box); }
    Object.assign(box, s);
    if (readText(box.el) !== box.text) {
      box.el.textContent = box.text;
      if (document.activeElement === box.el) caretToEnd(box.el);
    }
    box.el.classList.toggle('dirty', box.dirty);
    if (box.cover) box.cover.classList.toggle('on', box.dirty);
    styleBox(box);
    if (state.sel.has(box)) updateToolbar();
  }
  box.last = s;
  updateStatusCount();
}

function applyUndo(h) {
  if (h.group) for (let i = h.group.length - 1; i >= 0; i--) applyUndo(h.group[i]);
  else if (h.undo) h.undo();
  else restore(h.box, h.before);
}
function applyRedo(h) {
  if (h.group) h.group.forEach(applyRedo);
  else if (h.redo) h.redo();
  else restore(h.box, h.after);
}
function undo() {
  const h = state.undo.pop();
  if (!h) return toast('Nothing to undo');
  applyUndo(h);
  state.redo.push(h); state.noMerge = true; updateUndoButtons(); refreshFind();
}
function redo() {
  const h = state.redo.pop();
  if (!h) return toast('Nothing to redo');
  applyRedo(h);
  state.undo.push(h); state.noMerge = true; updateUndoButtons(); refreshFind();
}
function updateUndoButtons() {
  $('undo').disabled = !state.undo.length;
  $('redo').disabled = !state.redo.length;
}
function caretToEnd(el) {
  const r = document.createRange(); r.selectNodeContents(el); r.collapse(false);
  const s = getSelection(); s.removeAllRanges(); s.addRange(r);
}

$('undo').addEventListener('mousedown', e => e.preventDefault());
$('redo').addEventListener('mousedown', e => e.preventDefault());
$('undo').addEventListener('click', undo);
$('redo').addEventListener('click', redo);

// True while the user is typing somewhere that should keep its own keyboard behaviour
const isTyping = e => e.target.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || $('sigDlg').open;

document.addEventListener('keydown', e => {
  if (!(e.ctrlKey || e.metaKey) || e.altKey) return;
  const k = e.key.toLowerCase();
  if (e.target.closest?.('#findbar') && (k === 'z' || k === 'y')) return; // let the find inputs undo their own text
  if (k === 'z' && !e.shiftKey) { e.preventDefault(); undo(); }
  else if (k === 'y' || (k === 'z' && e.shiftKey)) { e.preventDefault(); redo(); }
  else if (k === 'f' && state.pages.length) { e.preventDefault(); openFind(); }
  else if ((k === '=' || k === '+') && state.pages.length) { e.preventDefault(); zoomStep(1); }
  else if (k === '-' && state.pages.length) { e.preventDefault(); zoomStep(-1); }
  else if (k === '0' && state.pages.length) { e.preventDefault(); setZoom(1); }
}, true);

// Delete removes the selection, Escape clears it (when not typing)
document.addEventListener('keydown', e => {
  if (isTyping(e)) return;
  if ((e.key === 'Delete' || e.key === 'Backspace') && (state.shape || (state.mode === 'move' && state.sel.size))) {
    e.preventDefault(); deleteSelection();
  } else if (e.key === 'Escape') {
    clearSel(); updateToolbar();
  }
});

// ---------- selection ----------
// state.sel holds the selected text pieces (several only in Move mode, all on one page);
// state.selected is the one the style controls show. state.shape is a selected image/redaction.
function clearSel() {
  for (const b of state.sel) b.el.classList.remove('sel');
  state.sel.clear();
  state.selected = null;
  if (state.shape) { state.shape.el.classList.remove('sel'); state.shape = null; }
}

function select(box, additive = false) {
  if (!additive || state.shape || (box && [...state.sel].some(b => b.page !== box.page))) clearSel();
  if (box && additive && state.sel.has(box)) {
    state.sel.delete(box); box.el.classList.remove('sel');
    box = [...state.sel].pop() || null;
  } else if (box) {
    state.sel.add(box); box.el.classList.add('sel');
  }
  state.selected = box;
  updateToolbar();
}

function selectMany(boxes) {
  clearSel();
  for (const b of boxes) { state.sel.add(b); b.el.classList.add('sel'); }
  state.selected = boxes[0] || null;
  updateToolbar();
}

function deselect(box) {
  if (!state.sel.delete(box)) return;
  box.el.classList.remove('sel');
  if (state.selected === box) state.selected = [...state.sel].pop() || null;
  updateToolbar();
}

function selectShape(s) {
  clearSel();
  state.shape = s;
  if (s) s.el.classList.add('sel');
  if (s && MARK_KINDS.has(s.kind)) {
    $('mkColor').value = s.color;
    if (s.kind !== 'hl') {
      const pt = s.sw / state.pages[s.page].scale;
      $('mkWidth').value = [...$('mkWidth').options].map(o => o.value).sort((a, b) => Math.abs(a - pt) - Math.abs(b - pt))[0];
    }
  }
  updateToolbar();
}

function updateToolbar() {
  const b = state.selected, n = state.sel.size;
  ['size', 'bold', 'color'].forEach(id => $(id).disabled = !b);
  $('dup').disabled = !b && !state.shape;
  $('del').disabled = !n && !state.shape;
  if (b) {
    $('size').value = Math.round(b.fontPx / state.pages[b.page].scale * 2) / 2;
    $('bold').classList.toggle('on', b.bold);
    $('color').value = b.color;
  }
  $('arLine').disabled = n !== 1;
  ['arLeft', 'arRight', 'arBase', 'arJoin'].forEach(id => $(id).disabled = n < 2);
  $('arCount').textContent = n ? `${n} selected` : 'Nothing selected';
}

// ---------- toolbar ----------
const targets = () => state.sel.size ? [...state.sel] : state.selected ? [state.selected] : [];

// Keep focus in the text when clicking toolbar buttons
['bold', 'dup', 'del'].forEach(id => $(id).addEventListener('mousedown', e => e.preventDefault()));

$('size').addEventListener('input', () => {
  const v = parseFloat($('size').value), t = targets();
  if (!t.length || !(v > 0)) return;
  beginBatch();
  for (const b of t) { b.fontPx = v * state.pages[b.page].scale; styleBox(b); markDirty(b); commit(b, null); }
  endBatch('size');
});
$('bold').addEventListener('click', () => {
  const t = targets(); if (!t.length) return;
  const on = !state.selected.bold;
  beginBatch();
  for (const b of t) { b.bold = on; styleBox(b); markDirty(b); commit(b, null); }
  endBatch();
  $('bold').classList.toggle('on', on);
});
$('color').addEventListener('input', () => {
  const t = targets(); if (!t.length) return;
  beginBatch();
  for (const b of t) { b.color = $('color').value; styleBox(b); markDirty(b); commit(b, null); }
  endBatch('color');
});
$('del').addEventListener('click', deleteSelection);

function deleteSelection() {
  if (state.shape) return deleteShape(state.shape);
  const t = targets(); if (!t.length) return;
  beginBatch();
  t.forEach(removeBox);
  endBatch();
}

const HINTS = {
  edit: 'Click text to edit it · Ctrl+F find & replace',
  add: 'Click on a page to add text',
  move: 'Drag to move · Shift+click selects several · double-click selects a line · Alt turns off snapping',
  redact: 'Drag over anything to black it out · redacted pages are flattened on download',
  annotate: 'Click text to mark it, or drag across it · Shift keeps lines straight',
};
function setMode(m) {
  state.mode = m;
  [['modeEdit', 'edit'], ['modeAdd', 'add'], ['modeMove', 'move'], ['modeAnnotate', 'annotate'], ['modeRedact', 'redact']]
    .forEach(([id, k]) => $(id).classList.toggle('on', m === k));
  ['add', 'move', 'annotate', 'redact'].forEach(k => document.body.classList.toggle(k, m === k));
  $('hint').textContent = HINTS[m];

$('modeEdit').addEventListener('click', () => setMode('edit'));
$('modeAdd').addEventListener('click', () => setMode('add'));
$('modeMove').addEventListener('click', () => setMode('move'));
$('modeRedact').addEventListener('click', () => setMode('redact'));
$('modeAnnotate').addEventListener('click', () => setMode('annotate'));

// ---------- moving & aligning ----------
const SNAP_PX = 6;

// Screen pixels per layout pixel for a page (the zoom level), and pointer position in page layout px
const scaleOf = layer => layer.getBoundingClientRect().width / layer.offsetWidth || 1;
function toLayer(e, layer) {
  const r = layer.getBoundingClientRect(), z = scaleOf(layer);
  return { x: (e.clientX - r.left) / z, y: (e.clientY - r.top) / z };
}

function guide(layer, dir) {
  const key = '_guide' + dir;
  if (!layer[key]) {
    layer[key] = document.createElement('div');
    layer[key].className = 'guide ' + dir;
    layer.append(layer[key]);
  }
  return layer[key];
}
function showGuides(layer, x, y) {
  const v = guide(layer, 'v'), h = guide(layer, 'h');
  v.style.display = x == null ? 'none' : 'block'; if (x != null) v.style.left = x + 'px';
  h.style.display = y == null ? 'none' : 'block'; if (y != null) h.style.top = y + 'px';
}

// Closest target within SNAP_PX of any of the given edges -> { shift, at } or null
function nearest(targets, edges) {
  let best = null;
  for (const t of targets) for (const e of edges) {
    const d = t - e;
    if (Math.abs(d) <= SNAP_PX && (!best || Math.abs(d) < Math.abs(best.shift))) best = { shift: d, at: t };
  }
  return best;
}

// The pieces of text that make up the visual line containing `box`: same baseline, no big gaps
function lineOf(box) {
  const tol = box.fontPx * 0.35, right = b => b.left + b.el.offsetWidth;
  const row = state.boxes
    .filter(b => b.page === box.page && !b.deleted && b.text.trim() && Math.abs(b.baseline - box.baseline) < tol)
    .sort((a, b) => a.left - b.left);
  let lo = row.indexOf(box), hi = lo;
  while (lo > 0 && row[lo].left - right(row[lo - 1]) < box.fontPx * 1.2) lo--;
  while (hi < row.length - 1 && row[hi + 1].left - right(row[hi]) < box.fontPx * 1.2) hi++;
  return row.slice(lo, hi + 1);
}

// Clicking empty page space clears the selection; in Move mode, pressing on text selects and drags it.
// The whole selection moves together; its edges snap to other text (Shift = one direction, Alt = no snapping).
pagesEl.addEventListener('pointerdown', e => {
  const t = e.target;
  if (t.classList.contains('layer')) {
    if (state.mode === 'edit' || state.mode === 'move') { clearSel(); updateToolbar(); }
    return;
  }
  if (state.mode !== 'move' || !t.classList.contains('box')) return;
  e.preventDefault(); // don't start editing
  const box = t._box;
  if (e.shiftKey) return select(box, true);
  if (!state.sel.has(box)) select(box);
  else { state.selected = box; updateToolbar(); }

  const group = [...state.sel], layer = state.pages[box.page].layer, z = scaleOf(layer);
  const xs = [layer.clientWidth / 2], ys = [];
  for (const b of state.boxes) {
    if (state.sel.has(b) || b.page !== box.page || !b.text.trim()) continue;
    xs.push(b.left, b.left + b.el.offsetWidth);
    ys.push(b.baseline);
  }
  const start = group.map(b => ({ b, left: b.left, base: b.baseline, w: b.el.offsetWidth }));
  const minL = Math.min(...start.map(s => s.left)), maxR = Math.max(...start.map(s => s.left + s.w));
  const minT = Math.min(...start.map(s => s.base - s.b.fontPx)), maxB = Math.max(...start.map(s => s.base));
  const base0 = box.baseline, startX = e.clientX, startY = e.clientY;
  let moved = false;
  box.el.setPointerCapture(e.pointerId);

  const onMove = ev => {
    let dx = (ev.clientX - startX) / z, dy = (ev.clientY - startY) / z;
    if (!moved && Math.hypot(dx, dy) < 2) return;
    moved = true;
    if (ev.shiftKey) { if (Math.abs(dx) > Math.abs(dy)) dy = 0; else dx = 0; }
    let gx = null, gy = null;
    if (!ev.altKey) {
      if (dx !== 0 || !ev.shiftKey) {
        const sx = nearest(xs, [minL + dx, maxR + dx, (minL + maxR) / 2 + dx]);
        if (sx) { dx += sx.shift; gx = sx.at; }
      }
      if (dy !== 0 || !ev.shiftKey) {
        const sy = nearest(ys, [base0 + dy]);
        if (sy) { dy += sy.shift; gy = sy.at; }
      }
    }
    dx = Math.max(-minL, Math.min(layer.clientWidth - maxR, dx));
    dy = Math.max(-minT, Math.min(layer.clientHeight - maxB, dy));
    for (const s of start) { s.b.left = s.left + dx; s.b.baseline = s.base + dy; styleBox(s.b); }
    showGuides(layer, gx, gy);
  };
  const onUp = () => {
    box.el.removeEventListener('pointermove', onMove);
    box.el.removeEventListener('pointerup', onUp);
    box.el.removeEventListener('pointercancel', onUp);
    showGuides(layer, null, null);
    if (moved) { beginBatch(); for (const b of group) { markDirty(b); commit(b, null); } endBatch(); }
  };
  box.el.addEventListener('pointermove', onMove);
  box.el.addEventListener('pointerup', onUp);
  box.el.addEventListener('pointercancel', onUp);
});

// Double-click in Move mode selects the whole line
pagesEl.addEventListener('dblclick', e => {
  if (state.mode === 'move' && e.target.classList.contains('box')) selectMany(lineOf(e.target._box));
});

function arrange(kind) {
  const g = [...state.sel];
  if (g.length < 2) return;
  const w = b => b.el.offsetWidth;
  const L = Math.min(...g.map(b => b.left)), R = Math.max(...g.map(b => b.left + w(b))), B = state.selected.baseline;
  beginBatch();
  for (const b of g) {
    if (kind === 'left') b.left = L;
    else if (kind === 'right') b.left = R - w(b);
    else b.baseline = B;
    styleBox(b); markDirty(b); commit(b, null);
  }
  endBatch();
}

// Merge the selected pieces (left to right) into the first one, so a line can be edited as one
function joinSelection() {
  const g = [...state.sel].sort((a, b) => a.left - b.left);
  if (g.length < 2) return;
  const first = g[0];
  let text = first.text, prevRight = first.left + first.el.offsetWidth;
  for (const b of g.slice(1)) {
    text += (b.left - prevRight > first.fontPx * 0.15 && !/\s$/.test(text) ? ' ' : '') + b.text;
    prevRight = b.left + b.el.offsetWidth;
  }
  beginBatch();
  g.slice(1).forEach(removeBox);
  first.text = text; first.el.textContent = text;
  markDirty(first); styleBox(first); commit(first, null);
  endBatch();
  selectMany([first]);
  toast('Joined into one piece — switch to Edit to change it');
}

$('arLine').addEventListener('click', () => { if (state.selected) selectMany(lineOf(state.selected)); });
$('arLeft').addEventListener('click', () => arrange('left'));
$('arRight').addEventListener('click', () => arrange('right'));
$('arBase').addEventListener('click', () => arrange('base'));
$('arJoin').addEventListener('click', joinSelection);

// Arrow keys nudge the selection (Shift = 10px): text in Move mode, or a selected image/redaction
document.addEventListener('keydown', e => {
  if (!e.key.startsWith('Arrow') || isTyping(e)) return;
  const d = e.shiftKey ? 10 : 1;
  const dx = e.key === 'ArrowLeft' ? -d : e.key === 'ArrowRight' ? d : 0;
  const dy = e.key === 'ArrowUp' ? -d : e.key === 'ArrowDown' ? d : 0;
  if (state.shape) {
    e.preventDefault();
    const s = state.shape, before = shapeSnap(s);
    moveShape(s, dx, dy); styleShape(s);
    recordShape(s, before);
    return;
  }
  if (state.mode !== 'move' || !state.sel.size) return;
  e.preventDefault();
  beginBatch();
  for (const b of state.sel) { b.left += dx; b.baseline += dy; styleBox(b); markDirty(b); commit(b, null); }
  endBatch('nudge');
});

// Add-text mode: click empty space on a page to drop a new text box
pagesEl.addEventListener('mousedown', e => {
  if (state.mode !== 'add' || !e.target.classList.contains('layer')) return;
  e.preventDefault();
  const pageIdx = +e.target.dataset.page;
  const p = state.pages[pageIdx];
  const { x, y } = toLayer(e, e.target);
  // New text always starts plain (12pt, black, regular); use Duplicate to copy an existing style
  const fontPx = 12 * p.scale;
  const box = addBox({
    page: pageIdx, left: x, baseline: y + fontPx * 0.6, fontPx, text: '', orig: null,
    family: 'sans', bold: false, italic: false, color: '#000000',
  });
  markDirty(box);
  box.el.focus(); // mousedown's default is prevented, so focus can move right away
});

// Duplicate: copy the selected text with exactly the same font, size and colour just below it,
// or the selected image/redaction slightly offset
function duplicate() {
  if (state.shape) {
    const { el, svg, handle, deleted, ...props } = state.shape;
    const s = addShape(props);
    moveShape(s, 14, 14); styleShape(s);
    recordShape(s, { ...shapeSnap(s), deleted: true });
    selectShape(s);
    return;
  }
  const src = state.selected;
  if (!src || src.deleted || !src.text.trim()) return toast('Select some text to duplicate');
  const layer = state.pages[src.page].layer;
  let baseline = src.baseline + src.fontPx * 1.4;
  if (baseline > layer.clientHeight) baseline = src.baseline - src.fontPx * 1.4;
  const box = addBox({
    page: src.page, left: src.left, baseline, fontPx: src.fontPx, text: src.text, orig: null,
    font: src.font, family: src.family, bold: src.bold, origBold: src.origBold, italic: src.italic, color: src.color,
  });
  markDirty(box);
  styleBox(box);
  commit(box, null);
  if (document.activeElement === src.el) src.el.blur();
  select(box);
  if (state.mode === 'edit') { // ready to type over the copy
    box.el.focus();
    const rg = document.createRange(); rg.selectNodeContents(box.el);
    getSelection().removeAllRanges(); getSelection().addRange(rg);
  }
  toast(state.mode === 'move' ? 'Copied — drag it into place' : 'Copied — type to change it, or use Move to place it');
}
$('dup').addEventListener('click', duplicate);
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'd') { e.preventDefault(); duplicate(); }
}, true);

// ---------- find & replace ----------
// Searches each piece of text separately (a phrase split across pieces isn't found; Join them first).
const find = { hits: [], i: -1 };
const escapeRe = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
function findRe() {
  const q = $('findQ').value;
  return q ? new RegExp(escapeRe(q), 'g' + ($('findCase').checked ? '' : 'i')) : null;
}
function openFind() {
  if (!state.pages.length) return;
  $('findbar').hidden = false;
  $('findQ').focus(); $('findQ').select();
  refreshFind();
}
function closeFind() {
  $('findbar').hidden = true;
  for (const b of find.hits) b.el.classList.remove('match', 'cur');
  find.hits = []; find.i = -1;
}
function refreshFind() {
  if ($('findbar').hidden) return;
  for (const b of find.hits) b.el.classList.remove('match', 'cur');
  const re = findRe();
  let total = 0;
  find.hits = [];
  if (re) for (const pi of state.order) {
    if (state.pages[pi].deleted) continue;
    const onPage = state.boxes.filter(b => b.page === pi && !b.deleted)
      .sort((a, b) => a.baseline - b.baseline || a.left - b.left);
    for (const b of onPage) {
      const n = (b.text.match(re) || []).length;
      if (n) { find.hits.push(b); total += n; b.el.classList.add('match'); }
    }
  }
  if (find.i >= find.hits.length) find.i = find.hits.length - 1;
  if (find.i >= 0) find.hits[find.i].el.classList.add('cur');
  $('findCount').textContent = !re ? '' : !total ? 'No matches'
    : (find.i >= 0 ? `${find.i + 1}/${find.hits.length} · ` : '') + `${total} found`;
  ['findPrev', 'findNext', 'findOne', 'findAll'].forEach(id => $(id).disabled = !find.hits.length);
}
function goHit(dir) {
  if (!find.hits.length) return;
  find.i = (find.i + dir + find.hits.length) % find.hits.length;
  const b = find.hits[find.i];
  if (!state.sel.has(b)) select(b);
  b.el.scrollIntoView({ block: 'center', inline: 'nearest', behavior: 'smooth' });
  refreshFind();
}
function replaceIn(b) {
  const re = findRe(), rep = $('findR').value;
  const text = b.text.replace(re, () => rep);
  if (text === b.text) return 0;
  const n = (b.text.match(re) || []).length;
  b.text = text; b.el.textContent = text;
  markDirty(b); styleBox(b); commit(b, null);
  return n;
}
$('findQ').addEventListener('input', () => { find.i = -1; refreshFind(); });
$('findCase').addEventListener('change', () => { find.i = -1; refreshFind(); });
$('findQ').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); goHit(e.shiftKey ? -1 : 1); } });
$('findR').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); $('findOne').click(); } });
$('findbar').addEventListener('keydown', e => { if (e.key === 'Escape') { closeFind(); e.stopPropagation(); } });
$('findPrev').addEventListener('click', () => goHit(-1));
$('findNext').addEventListener('click', () => goHit(1));
$('findOne').addEventListener('click', () => {
  if (find.i < 0) return goHit(1); // first show the match, then replace on the next click
  const i = find.i;
  replaceIn(find.hits[i]);
  refreshFind();
  find.i = i - 1;
  goHit(1);
});
$('findAll').addEventListener('click', () => {
  if (!find.hits.length) return;
  let n = 0;
  beginBatch();
  for (const b of find.hits) n += replaceIn(b);
  endBatch();
  find.i = -1; refreshFind();
  toast(`Replaced ${n} match${n === 1 ? '' : 'es'}`);
});
$('findClose').addEventListener('click', closeFind);
$('findBtn').addEventListener('click', () => { if (!state.pages.length) return toast('Open a PDF first'); $('findbar').hidden ? openFind() : closeFind(); });

// ---------- zoom ----------
// Zoom scales the page area with CSS; all positions stay in the same layout units, and the
// canvases are re-rendered at the new resolution shortly after zooming stops.
const ZOOMS = [0.5, 0.67, 0.75, 0.9, 1, 1.1, 1.25, 1.5, 1.75, 2, 2.5, 3];
function setZoom(z) {
  if (!state.pages.length) return;
  z = Math.min(3, Math.max(0.5, z));
  const m = mainEl;
  const cx = (m.scrollLeft + m.clientWidth / 2) / m.scrollWidth, cy = (m.scrollTop + m.clientHeight / 2) / m.scrollHeight;
  state.zoom = z;
  pagesEl.style.zoom = z;
  $('zoomLbl').textContent = Math.round(z * 100) + '%';
  m.scrollLeft = cx * m.scrollWidth - m.clientWidth / 2;
  m.scrollTop = cy * m.scrollHeight - m.clientHeight / 2;
  clearTimeout(state.zoomTimer);
  state.zoomTimer = setTimeout(() => state.pages.forEach(p => renderPage(p).catch(console.error)), 200);
}
function zoomStep(dir) {
  const z = state.zoom;
  setZoom(dir > 0 ? (ZOOMS.find(v => v > z + 0.001) ?? 3) : ([...ZOOMS].reverse().find(v => v < z - 0.001) ?? 0.5));
}
$('zoomIn').addEventListener('click', () => zoomStep(1));
$('zoomOut').addEventListener('click', () => zoomStep(-1));
$('zoomLbl').addEventListener('click', () => setZoom(1));
let wheelAcc = 0;
mainEl.addEventListener('wheel', e => {
  if (!e.ctrlKey || !state.pages.length) return;
  e.preventDefault();
  wheelAcc += e.deltaY;
  if (Math.abs(wheelAcc) >= 40) { zoomStep(wheelAcc < 0 ? 1 : -1); wheelAcc = 0; }
}, { passive: false });

// ---------- page tools ----------
const pageSnap = () => ({ order: [...state.order], rot: state.pages.map(p => p.rot), del: state.pages.map(p => p.deleted) });
function applyPages(s) {
  state.order = [...s.order];
  state.pages.forEach((p, i) => { p.rot = s.rot[i]; p.deleted = s.del[i]; });
  layoutPages(); updateStatusCount(); refreshFind();
}
function recordPages(before) {
  const after = pageSnap();
  if (JSON.stringify(before) === JSON.stringify(after)) return;
  pushOp(() => applyPages(before), () => applyPages(after));
}

// Put slots in display order and apply rotation (rotated pages are view-only until rotated back)
function layoutPages() {
  const live = state.order.filter(i => !state.pages[i].deleted);
  for (const i of state.order) {
    const p = state.pages[i], side = p.rot % 180 !== 0;
    pagesEl.append(p.slot);
    p.slot.hidden = p.deleted;
    p.frame.style.width = (side ? p.vp.height : p.vp.width) + 'px';
    p.frame.style.height = (side ? p.vp.width : p.vp.height) + 'px';
    p.wrap.style.position = 'absolute';
    p.wrap.style.left = '50%';

pagesEl.addEventListener('click', e => {

// ---------- images, signatures & redactions ----------
// "Shapes" sit above the text on a page; they can be dragged in any mode and resized from the corner.
const shapeSnap = s => ({

// Annotation kinds. Lines (underline, strike-through, line, arrow) are stored as two end points.
const MARK_KINDS = new Set(['hl', 'rect', 'line', 'tick', 'cross']);
const SVG_NS = 'http://www.w3.org/2000/svg';

function arrowHead(x1, y1, x2, y2, sw) {
  const a = Math.atan2(y2 - y1, x2 - x1), len = Math.max(9, sw * 4);

// Polylines (page layout px) that draw a line/arrow/tick/cross — shared by the screen and the export

    if (s.arrow) { const [a, b] = arrowHead(s.x1, s.y1, s.x2, s.y2, s.sw); lines.push([a, [s.x2, s.y2], b]); }

  if (s.kind === 'tick') return [[P(0.08, 0.55), P(0.38, 0.88), P(0.92, 0.12)]];

function renderMark(s) {

  const stroke = `fill="none" stroke="${s.color}" stroke-width="${s.sw}" stroke-linecap="round" stroke-linejoin="round"`;

// ---------- annotations ----------
const ann = { tool: 'hl', colors: { hl: '#ffd43b', pen: '#e03131' }, width: 2 };

// Text pieces on a page whose bounds intersect a rectangle, grouped into rows (same baseline)

    const row = rows.find(r => Math.abs(r[0].baseline - b.baseline) < r[0].fontPx * 0.35);

// Annotate mode: click text to mark it, or drag to draw
pagesEl.addEventListener('pointerdown', e => {
  if (state.mode !== 'annotate' || e.button !== 0) return;
  const t = e.target, onBox = t.classList.contains('box');
  if (!onBox && !t.classList.contains('layer')) return;
  e.preventDefault();
  if (document.activeElement?.classList.contains('box')) document.activeElement.blur();
  selectShape(null);
  const layer = onBox ? t.closest('.layer') : t, page = +layer.dataset.page, scale = state.pages[page].scale;
  const tool = ann.tool, color = toolColor(tool), sw = ann.width * scale, textTool = ['hl', 'ul', 'st'].includes(tool);

    const q = toLayer(ev, layer);

    if (!moved && Math.hypot(p.x - p0.x, p.y - p0.y) < 3) return;
    moved = true;
    if (['line', 'arrow', 'ul', 'st'].includes(tool)) {

      Object.assign(live, { left: Math.min(p0.x, p0.x + w), top: Math.min(p0.y, p0.y + h), w: Math.abs(w), h: Math.abs(h) });

    layer.removeEventListener('pointermove', onMove);

// Annotate bar: tool, colour, thickness (colour/thickness also edit the selected mark)
document.querySelectorAll('#annot [data-tool]').forEach(btn => btn.addEventListener('click', () => {

const selectedMark = () => state.shape && MARK_KINDS.has(state.shape.kind) ? state.shape : null;
let markBefore = null;

// Redact mode: drag on a page to draw a black box
pagesEl.addEventListener('pointerdown', e => {

  e.preventDefault();

const readDataURL = blob => new Promise((res, rej) => {
  const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(new Error('Could not read that file')); r.readAsDataURL(blob);
});

});

async function insertImageFile(file) {

  try {
    let src = await readDataURL(file), mime = file.type;
    const img = await loadImg(src);
    if (mime !== 'image/png' && mime !== 'image/jpeg') { // WebP, GIF, …: convert to PNG for the PDF
      const c = document.createElement('canvas');
      c.width = img.naturalWidth; c.height = img.naturalHeight;

// Page nearest the middle of the view (skipping deleted and rotated pages)
function visiblePage() {
  const m = mainEl.getBoundingClientRect(), mid = m.top + m.height / 2;
  let best = null, bestD = Infinity;
  for (const i of state.order) {
    const p = state.pages[i];
    if (p.deleted || p.rot) continue;
    const r = p.layer.getBoundingClientRect();
    const d = mid < r.top ? r.top - mid : mid > r.bottom ? mid - r.bottom : 0;
    if (d < bestD) { bestD = d; best = i; }
  }
  return best;
}

// Drop an image onto the page in view, centred, at most maxFrac of the page in each direction

$('imgInput').addEventListener('change', e => { const f = e.target.files[0]; e.target.value = ''; if (f) insertImageFile(f); });

// Signature pad: smooth strokes, then crop to the ink and place it as a transparent PNG
const sig = { pad: $('sigPad'), color: '#111111', drawing: false, ink: false, last: null, mid: null };
const sctx = sig.pad.getContext('2d');
function sigReset() {

}

$('sigBtn').addEventListener('click', () => {

});

});

['pointerup', 'pointercancel'].forEach(t => sig.pad.addEventListener(t, () => { sig.drawing = false; }));
$('sigClear').addEventListener('click', sigReset);
document.querySelectorAll('.pen').forEach(b => b.addEventListener('click', () => {
  sig.color = b.dataset.c;
  document.querySelectorAll('.pen').forEach(x => x.classList.toggle('on', x === b));
}));
$('sigDlg').addEventListener('close', () => {
